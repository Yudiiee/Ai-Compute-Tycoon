<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Compute Tycoon</title>
<meta name="description" content="Idle tycoon: build GPU, CPU, RAM and SSD clusters, wire up a network core, train in-house AI models and sell API keys.">
<meta name="theme-color" content="#060a0f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Tycoon">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* base reset (the artifact host normally provides this) */
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font:14px system-ui,sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
  html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed rendered data-center hall behind a HUD — top telemetry bar, scrolling work area, bottom command dock. Single dark look by design. */
:root{
  color-scheme:dark;
  --bg:#060a0f;
  --panel:rgba(9,18,27,.94);
  --panel-2:rgba(14,28,40,.92);
  --line:#1c3446;
  --line-hi:#2c6682;
  --cyan:#43e3ff;
  --cyan-dim:#1d86a3;
  --green:#3dffa2;
  --amber:#ffb547;
  --red:#ff4d63;
  --violet:#a891ff;
  --gold:#e9c46f;
  --ink:#d6eaf3;
  --ink-dim:#86a3b6;
  --ink-faint:#4f6a7d;
  --f-display:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --f-body:"Barlow Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   linear-gradient(to bottom,rgba(6,10,15,.78) 0,rgba(6,10,15,.35) 22%,rgba(6,10,15,.42) 60%,rgba(6,10,15,.9) 100%),
   radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(6,10,15,.55) 100%)}

#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- HUD primitives ---------- */
.hud{position:relative;background:var(--panel);border:1px solid var(--line-hi);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  box-shadow:inset 0 0 0 1px rgba(67,227,255,.05),inset 0 0 28px rgba(67,227,255,.05);}
.hud::before{content:"";position:absolute;left:0;top:0;width:14px;height:14px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan);clip-path:polygon(0 0,100% 0,0 100%);opacity:.9}
.hud-title{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);display:flex;align-items:center;gap:8px;margin:0}
.hud-title small{color:var(--ink-dim);letter-spacing:.08em;font-weight:500}
.label{font-family:var(--f-display);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.ok{color:var(--green)}.warn{color:var(--amber)}.crit{color:var(--red)}.info{color:var(--cyan)}.vio{color:var(--violet)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:6px 14px;
  font-family:var(--f-display);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(to bottom,rgba(67,227,255,.16),rgba(67,227,255,.05));color:var(--ink);
  border:1px solid var(--cyan-dim);clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px);transition:background .15s,border-color .15s,transform .05s}
.btn:hover:not(:disabled){background:linear-gradient(to bottom,rgba(67,227,255,.3),rgba(67,227,255,.1));border-color:var(--cyan)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;filter:saturate(.4)}
.btn .cost{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:0;color:var(--cyan);text-transform:none}
.btn.primary{background:linear-gradient(to bottom,rgba(61,255,162,.22),rgba(61,255,162,.06));border-color:#22a86c}
.btn.primary .cost{color:var(--green)}
.btn.amber{background:linear-gradient(to bottom,rgba(255,181,71,.22),rgba(255,181,71,.06));border-color:#b07a25}
.btn.amber .cost{color:var(--amber)}
.btn.ghost{background:transparent;border-color:var(--line-hi)}
.btn.small{min-height:32px;padding:4px 10px;font-size:11px}
.btn.block{width:100%}

.bar{height:6px;background:rgba(255,255,255,.06);border:1px solid var(--line);position:relative;overflow:hidden}
.bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--cyan);box-shadow:0 0 8px currentColor;transition:width .3s}

/* ---------- Header ---------- */
header.top{flex:none;padding:8px 16px 6px;display:flex;flex-direction:column;gap:6px}
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.op{display:flex;align-items:center;gap:9px;min-width:0}
.avatar{width:36px;height:36px;flex:none;border:1px solid var(--line-hi);background:linear-gradient(135deg,#0f2433,#07121b);display:grid;place-items:center}
.op .who{min-width:0}
.op b{display:block;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;white-space:nowrap}
.plaque{position:relative;padding:4px 30px 6px;text-align:center;
  background:linear-gradient(to bottom,rgba(20,52,74,.95),rgba(8,22,33,.95));border:1px solid var(--cyan-dim);
  clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,18px 100%);box-shadow:0 0 30px rgba(67,227,255,.25)}
.plaque span{display:block;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.12em;
  background:linear-gradient(to bottom,#e9fbff 20%,#6fe7ff 70%,#2bb6d8);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px rgba(67,227,255,.35)}
.plaque small{display:block;font-family:var(--f-display);font-size:9.5px;letter-spacing:.2em;color:var(--ink-dim);margin-top:3px;white-space:nowrap}
.top-right{display:flex;justify-content:flex-end}
.btn-rp{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 8px;background:var(--panel);border:1px solid var(--line-hi);clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.btn-rp:hover{border-color:var(--cyan)}
.btn-rp .t{text-align:left}
.btn-rp b{display:block;font-family:var(--f-mono);font-size:14px;color:var(--violet)}

.statbar{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:1px;border:1px solid var(--line-hi);background:var(--line)}
.stat{padding:6px 12px;min-width:0;background:rgba(9,18,27,.9);}
.stat .v{font-family:var(--f-mono);font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
.stat .bar{margin-top:4px}
.credits .v{font-size:21px;color:#f3fbff;display:flex;align-items:center;gap:6px}
.coin{width:16px;height:16px;flex:none}

/* ---------- Main ---------- */
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:6px 16px;padding-inline:16px;scrollbar-width:thin;scrollbar-color:var(--line-hi) transparent}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.directive{display:flex;align-items:center;gap:12px;padding:9px 14px}
.directive .msg{flex:1;min-width:0;font-size:15px}
.directive .tag{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.16em}

.boosters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boost{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;text-align:left;background:var(--panel);border:1px solid var(--line-hi);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);position:relative;overflow:hidden;min-width:0}
.boost:hover:not(:disabled){border-color:var(--cyan)}
.boost:disabled{opacity:.55}
.boost b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
.boost small{color:var(--ink-dim);font-size:12.5px}
.boost .st{font-family:var(--f-mono);font-size:11.5px;color:var(--violet)}
.boost .fill{position:absolute;left:0;bottom:0;height:2px;background:var(--green);box-shadow:0 0 6px var(--green)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- Rack cards ---------- */
.racks{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:760px;width:100%;margin:0 auto}
.rack{position:relative;display:flex;flex-direction:column;gap:6px;padding:0;background:none;border:0;text-align:left;min-width:0}
.rack-tag{align-self:center;padding:3px 10px;background:rgba(8,20,30,.9);border:1px solid var(--cyan-dim);text-align:center;min-width:70%;max-width:100%;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.rack-tag .label{font-size:9px}
.rack-tag b{display:block;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rack-tag.none b{color:var(--ink-faint)}
.rack-tag.bad b{color:var(--amber)}

.cab{position:relative;display:grid;grid-template-columns:22px 1fr;gap:6px;padding:24px 10px 12px 8px;
  background:linear-gradient(90deg,#16222d,#1d2b37 45%,#121c26);border:1px solid #2d4557;border-radius:3px 3px 1px 1px;
  box-shadow:0 10px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .2s,box-shadow .2s}
.rack:hover .cab,.rack:focus-visible .cab{border-color:var(--cyan);box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 18px rgba(67,227,255,.28)}
.cab-head{position:absolute;left:0;right:0;top:0;height:18px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--f-display);font-weight:600;font-size:9.5px;letter-spacing:.2em;color:var(--cyan);
  background:linear-gradient(#10222f,#0a1720);border-bottom:1px solid #264256}
.cab-head .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-faint)}
.cab-head .dot.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.door{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:4px 0;background:linear-gradient(#0d1821,#101d28);border:1px solid #223848}
.door .ai{font-family:var(--f-display);font-weight:700;font-size:13px;color:#8fdcff;writing-mode:vertical-rl;letter-spacing:.1em;text-shadow:0 0 8px rgba(67,227,255,.6)}
.door .leds{display:flex;flex-direction:column;gap:3px}
.door .leds i{width:4px;height:4px;border-radius:50%;background:var(--ink-faint)}
.door .leds i.on{background:var(--cyan);box-shadow:0 0 5px var(--cyan)}
.bays{display:grid;grid-template-rows:repeat(8,15px);gap:3px}
.bay{position:relative;background:#060c11;border:1px solid #182a36;border-radius:1px;overflow:hidden}
.bay.empty::after{content:"";position:absolute;inset:4px 6px;background:repeating-linear-gradient(90deg,#132430 0 2px,transparent 2px 6px);opacity:.8}
.bay svg{display:block;width:100%;height:100%}
.bay.g{display:grid;grid-template-columns:minmax(0,1fr) 30%;gap:2px}
.bay .art{min-width:0;overflow:hidden}
.bay.noram .art{opacity:.35;filter:grayscale(.6)}
.bay.noram .ram{box-shadow:inset 0 0 0 1px var(--red);animation:blink 1.4s ease-in-out infinite}
.bay:not(.empty){background:#04080c}
.rack.throttle{--fc:var(--amber)}
.rack.down{--fc:var(--red)}
@keyframes flow{to{transform:translateY(20px)}}
@keyframes blink{50%{opacity:.15}}
.rack-meta{display:flex;flex-direction:column;gap:3px;padding:0 2px}
.rack-meta .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.rack-meta .nm b{font-family:var(--f-display);font-weight:700;font-size:13.5px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rack-meta .nm span{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim)}
.rack-meta .row{display:flex;justify-content:space-between;align-items:center;gap:6px}
.rack-meta .rev{font-family:var(--f-mono);font-weight:600;font-size:13.5px;color:var(--green)}
.temp{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:1px 6px;border:1px solid currentColor;border-radius:2px}

.rack-new{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;max-width:760px;width:100%;margin:0 auto;padding:16px;
  border:1px dashed var(--line-hi);background:rgba(9,18,27,.55);text-align:center;color:var(--ink-dim)}
.rack-new:hover:not(:disabled){border-color:var(--cyan);color:var(--ink)}
.rack-new .plus{width:44px;height:44px;border:1px solid var(--cyan-dim);display:grid;place-items:center;font-size:26px;color:var(--cyan);font-family:var(--f-display)}
.rack-new b{font-family:var(--f-display);letter-spacing:.1em;font-size:13px;text-transform:uppercase;color:var(--ink)}
.rack-new:disabled{opacity:.55}

/* ---------- Cards / grids ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card p{margin:0;color:var(--ink-dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline}
.kv dt{font-family:var(--f-display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:13.5px;text-align:right}
.big{font-family:var(--f-mono);font-weight:600;font-size:22px}
.locked-note{font-size:13px;color:var(--ink-faint)}

/* model cards */
.model{flex-direction:row;align-items:flex-start;gap:12px}
.model .glyph{flex:none;width:52px;height:52px;border:1px solid var(--line-hi);display:grid;place-items:center;background:rgba(67,227,255,.05)}
.model .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.model h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.04em}
.model h3 small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;color:var(--ink-dim);letter-spacing:0}
.model.locked .glyph{filter:grayscale(1);opacity:.5}

/* power flow */
.flow{display:flex;height:26px;border:1px solid var(--line-hi);background:rgba(255,255,255,.03);overflow:hidden}
.flow i{height:100%;transition:width .3s;position:relative}
.flow .deficit{background:repeating-linear-gradient(135deg,rgba(255,77,99,.75) 0 6px,rgba(255,77,99,.3) 6px 12px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-dim)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;display:inline-block}
.src-solar{background:#ffd34d}.src-smr{background:#a891ff}.src-grid{background:#43e3ff}.src-batt{background:#3dffa2}.src-diesel{background:#ff8a4d}
.gen{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start}
.gen .ico{width:44px;height:44px;border:1px solid var(--line-hi);display:grid;place-items:center;background:rgba(67,227,255,.04)}
.gen h3{margin:0 0 2px;font-family:var(--f-display);font-size:15px;letter-spacing:.05em}
.gen .count{font-family:var(--f-mono);color:var(--ink-dim);font-size:12.5px}
.sun{display:flex;align-items:center;gap:10px}
.sunarc{position:relative;width:110px;height:34px;flex:none;overflow:hidden}
.sunarc::before{content:"";position:absolute;left:4px;right:4px;top:4px;height:60px;border:1px dashed var(--line-hi);border-radius:50%}
.sunarc i{position:absolute;width:10px;height:10px;border-radius:50%;margin:-5px 0 0 -5px;background:#ffd34d;box-shadow:0 0 10px #ffd34d}
.sunarc i.moon{background:#b9c7d6;box-shadow:0 0 8px #b9c7d6}

/* research */
.tree{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.branch{display:flex;flex-direction:column;gap:0;min-width:0}
.branch h3{margin:0 0 10px;font-family:var(--f-display);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.node{position:relative;padding:10px;border:1px solid var(--line);background:rgba(9,18,27,.9);display:flex;flex-direction:column;gap:6px;min-width:0}
.node + .link{height:14px;width:2px;margin-left:18px;background:var(--line)}
.node.done{border-color:currentColor}
.node.done h4::after{content:" ✓";}
.node.avail{border-color:var(--line-hi)}
.node.locked{opacity:.5}
.node h4{margin:0;font-family:var(--f-display);font-size:13.5px;letter-spacing:.04em;color:var(--ink)}
.node p{margin:0;font-size:13px;color:var(--ink-dim)}
.link.done{background:currentColor}

/* districts */
.mapbox{position:relative;border:1px solid var(--line-hi);background:rgba(4,12,18,.8);overflow:hidden}
#map{display:block;width:100%;height:auto;aspect-ratio:2/1;max-width:100%}
.district{gap:8px}
.district h3{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.04em}
.district .perks{display:flex;flex-wrap:wrap;gap:6px}
.district.current{border-color:var(--green)}

/* ---------- Dock ---------- */
nav.dock{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding:6px 16px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,rgba(6,10,15,.95),rgba(6,10,15,.7))}
nav.dock button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;padding:5px 4px;
  background:rgba(9,18,27,.85);border:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);min-width:0}
nav.dock button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav.dock button[aria-current="page"]{color:var(--cyan);border-color:var(--cyan-dim);background:linear-gradient(to bottom,rgba(67,227,255,.16),rgba(9,18,27,.9))}
nav.dock button svg{width:20px;height:20px}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;z-index:20;background:rgba(3,7,11,.72);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal{width:min(960px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding:16px;background:var(--panel-2)}
.modal.narrow{width:min(460px,100%)}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.modal-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan)}
.modal-head h2 small{display:block;font-family:var(--f-body);font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;color:var(--ink-dim)}
.x{width:38px;height:38px;flex:none;background:transparent;border:1px solid var(--line-hi);font-size:20px;line-height:1;color:var(--ink-dim)}
.x:hover{color:var(--ink);border-color:var(--cyan)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
.slots{display:flex;flex-direction:column;gap:5px;padding:12px;background:#050b10;border:1px solid var(--line)}
.slot{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:8px;height:34px}
.slot .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint)}
.slot .card-art{height:26px;border:1px solid #1a2d3a;background:#070f15}
.slot .card-art svg{display:block;width:100%;height:100%}
.slot .spec{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim);text-align:right;white-space:nowrap}
.slot.empty .card-art{background:repeating-linear-gradient(90deg,#0c1922 0 3px,transparent 3px 8px)}
.tiers{display:flex;flex-wrap:wrap;gap:6px}
.tier{padding:5px 9px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-dim)}
.tier[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:rgba(67,227,255,.1)}
.tier:disabled{opacity:.35}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.impact{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim);min-height:16px}
.meters{display:flex;flex-direction:column;gap:10px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .top .mono{font-size:13px}
.oc{display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 9px;border:1px solid var(--line);background:rgba(255,255,255,.02);text-align:left}
.mrow:hover:not(:disabled){border-color:var(--cyan)}
.mrow.active{border-color:var(--green);background:rgba(61,255,162,.06)}
.mrow:disabled{opacity:.45}
.mrow b{font-family:var(--f-display);font-size:13.5px;letter-spacing:.03em;display:block}
.mrow small{font-size:12.5px;color:var(--ink-dim)}
.mrow .r{font-family:var(--f-mono);font-size:12px;text-align:right}
.split{display:flex;gap:8px;flex-wrap:wrap}


/* GPU card motion: fans spin faster as the rack heats up; coolant flows; cores breathe */
.gart{position:relative;height:100%;aspect-ratio:8/1;max-width:100%}
.gart svg{display:block;width:100%;height:100%}
.ov{position:absolute;display:block;pointer-events:none}
/* smooth, compositor-only motion (transform / opacity) */
.fan{border-radius:50%;background-position:center;background-size:100% 100%;background-repeat:no-repeat;animation:spin .9s linear infinite}
.fan::after{content:"";position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:var(--hub)}
.fan.blow{animation-duration:.6s}
.fan.turbo{animation-duration:.5s}
.fan.turbo.rev{animation-direction:reverse}
.glo{border-radius:50%;background:radial-gradient(circle,var(--c) 0,color-mix(in srgb,var(--c) 45%,transparent) 35%,transparent 70%);animation:breathe 2.4s ease-in-out infinite}
.led{border-radius:50%;background:var(--c);box-shadow:0 0 3px var(--c);animation:breathe 1.6s ease-in-out infinite}
.flow{overflow:hidden;border-radius:1px}
.flow::before{content:"";position:absolute;top:0;bottom:0;left:0;width:calc(100% + 12px);background:repeating-linear-gradient(90deg,var(--c) 0 3px,transparent 3px 6px);opacity:.85;animation:flowx .5s linear infinite}
.flow.rev::before{animation-direction:reverse}
@keyframes flowx{from{transform:translateX(-6px)}to{transform:translateX(0)}}
.pring{background-position:center;background-size:100% 100%;background-repeat:no-repeat;border-radius:50%;animation:spin 6s linear infinite}
.conduit{overflow:hidden}
.conduit::before{content:"";position:absolute;top:0;bottom:0;left:0;width:22%;border-radius:40%;background:radial-gradient(ellipse at center,#fff6dc 0,#ffb347 30%,rgba(255,122,26,.5) 55%,transparent 72%);animation:zip 1.4s cubic-bezier(.5,0,.5,1) infinite}
.conduit.d2::before{animation-delay:-.7s}
@keyframes zip{from{transform:translateX(-100%)}to{transform:translateX(460%)}}
.rail{overflow:hidden;border-radius:1px}
.rail::before{content:"";position:absolute;top:0;bottom:0;left:0;width:18%;background:linear-gradient(90deg,transparent,#ffcf7a 40%,#fff6dc 50%,#ffcf7a 60%,transparent);animation:rail 2.6s ease-in-out infinite alternate}
@keyframes rail{from{transform:translateX(-10%)}to{transform:translateX(465%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}
.rack.idle .ov,.rack.idle .ov::before,.rack.down .ov,.rack.down .ov::before,.slots.idle .ov,.slots.idle .ov::before{animation:none}
.rack.idle .elec,.rack.down .elec,.rack.idle .pglow,.rack.down .pglow{display:none}
/* hardware catalog */
.hw{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hwcard{display:flex;flex-direction:column;gap:8px;padding:12px;min-width:0}
.hwcard .art{height:30px;background:#050b10;border:1px solid var(--line);padding:2px 4px}
.hwcard .art svg{display:block;width:100%;height:100%}
.hwcard h3{margin:0;font-family:var(--f-display);font-size:15px;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hwcard h3 small{font-family:var(--f-body);font-weight:500;font-size:12.5px;color:var(--ink-dim);letter-spacing:0}
.hwcard .specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.hwcard .specs div{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.hwcard .specs .label{font-size:9px}


.top-right{gap:8px;align-items:center}
.gear{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-hi);color:var(--ink-dim);clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px)}
.gear:hover{color:var(--cyan);border-color:var(--cyan)}
.fitrow{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;height:34px;align-items:end;border-bottom:1px solid var(--line)}
.fitrow i{display:block;min-height:3px}
.fitcap{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);margin-top:-4px}
.mgr-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 8px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.mgr-row.on{border-color:var(--green);background:rgba(61,255,162,.06)}
.mgr-row b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.03em}
.mgr-row small{font-size:12px;color:var(--ink-dim)}
.mgr-av{width:34px;height:34px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.02em;color:#061018;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.mgr-av.sm{width:18px;height:18px;font-size:10px;clip-path:none;border-radius:50%}
.mgr-av.t1{background:#9fb6c6}.mgr-av.t2{background:#43e3ff}.mgr-av.t3{background:#3dffa2}.mgr-av.t4{background:#ffb547}.mgr-av.t5{background:linear-gradient(135deg,#e9c46f,#a891ff)}
.mgr-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-dim);min-width:0}
.mgr-badge span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-badge b{font-family:var(--f-mono);color:var(--gold);font-size:12px}


/* host RAM sticks (DIMMs), drawn in the strip beside each GPU */
.ram{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:1px;padding:1px 2px;background:#02060a;min-width:0}
.stk{display:block;position:relative;border-radius:1px 1px 0 0;min-width:0;
  background:linear-gradient(to bottom,rgba(255,255,255,.35) 0 14%,transparent 14% 100%),repeating-linear-gradient(to bottom,var(--sc) 0 3px,var(--sd) 3px 4px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.2)}
.stk.e{background:#0a141b;box-shadow:inset 0 0 0 1px #16252f}
.stk:not(.e)::after{content:"";position:absolute;left:15%;right:15%;bottom:1px;height:2px;background:var(--sl);opacity:.8}
.grid8 .ram{position:relative}
.grid8 .ram:not(.noram)::before{content:"";position:absolute;left:-1px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:#8dffb5;box-shadow:0 0 4px #8dffb5;animation:ramled 1.4s ease-in-out infinite;z-index:1}
.grid8 .ram:nth-child(4n)::before{animation-delay:-.7s}
@keyframes ramled{0%,100%{opacity:1}50%{opacity:.2}}
.stk.r0{--sc:#2f9e5a;--sd:#1c6a3a;--sl:#8dffb5}
.stk.r1{--sc:#3272d9;--sd:#1f4a94;--sl:#9fc4ff}
.stk.r2{--sc:#1fb3ae;--sd:#12716e;--sl:#aefcf8}
.stk.r3{--sc:#7b5cff;--sd:#4a33b8;--sl:#d6ccff}
.stk.r4{--sc:#d9a63a;--sd:#8d6a1f;--sl:#fff0c2}
.stk.r5{--sc:#dffcff;--sd:#7fd6e8;--sl:#ffffff;box-shadow:0 0 4px rgba(120,230,255,.7)}
.rack.idle .ram::before,.rack.down .ram::before{animation:none;opacity:.25}
.slot{grid-template-columns:22px minmax(0,1fr) 36%!important;grid-template-rows:24px 12px;height:auto!important;row-gap:2px;padding:3px 4px;border:1px solid transparent;background:none;text-align:left;width:100%;cursor:pointer}
.slot .n{grid-row:1/3}
.slot .card-art{grid-column:2;height:24px!important}
.slot .spec{grid-column:2;grid-row:2;text-align:left!important;font-size:10.5px!important;line-height:12px}
.slot .ram{grid-column:3;grid-row:1/3;height:38px;padding:2px 3px;border:1px solid #16252f}
.slot.sel{border-color:var(--cyan);background:rgba(67,227,255,.07)}
.slot.noram .card-art{opacity:.4}
.slot.noram .ram{border-color:var(--red)}
.ramp{padding:12px;display:flex;flex-direction:column;gap:10px}
.dimms{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;height:74px;padding:6px;background:#02060a;border:1px solid var(--line)}
.dimm{position:relative;display:flex;align-items:flex-end;justify-content:center}
.dimm .stk{position:absolute;inset:0 0 14px}
.dimm span{font-family:var(--f-mono);font-size:10px;color:var(--ink-dim);line-height:12px}
.ramtiers .tier{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.ramtiers .tier small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-dim);font-weight:400}


/* ---------- full-width cluster card: GPU | bus | CPU | bus | RAM ---------- */
.rk-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rk-head .nm{display:flex;align-items:baseline;gap:8px;min-width:0}
.rk-head .nm b{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em}
.rk-head .nm span{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim)}
.rk-head .rack-tag{align-self:auto;min-width:0;flex:1;max-width:260px;margin-left:auto}
.rk-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:0 2px}
.rk-foot .spec{font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);flex:1;min-width:190px}
.rk-foot .rev{font-family:var(--f-mono);font-weight:600;font-size:15px;color:var(--green)}
.rk-foot .mgr-badge{flex:0 1 auto}
.chip.stab{font-size:10px}
.cab.wide{--rh:18px}
.grid8{display:grid;grid-template-columns:calc(var(--rh)*8) minmax(24px,1fr) clamp(54px,19%,124px) minmax(24px,1fr) minmax(66px,26%);grid-template-rows:repeat(8,var(--rh));gap:3px 0;min-width:0}
.gc{position:relative;background:#04080c;border:1px solid #182a36;border-radius:1px;overflow:hidden;min-width:0}
.gc svg{display:block;width:100%;height:100%}
.gc.empty{background:#060c11}
.gc.empty::after{content:"";position:absolute;inset:4px 6px;background:repeating-linear-gradient(90deg,#132430 0 2px,transparent 2px 6px);opacity:.8}
.gc.noram svg{opacity:.35;filter:grayscale(.6)}
.grid8 .ram{border:1px solid #16252f}
.grid8 .ram.noram{box-shadow:inset 0 0 0 1px var(--red);animation:blink 1.4s ease-in-out infinite}
.bus{align-self:center;height:4px;position:relative;overflow:hidden;background:rgba(67,227,255,.06);border-top:1px solid rgba(67,227,255,.12);border-bottom:1px solid rgba(67,227,255,.12)}
.bus::before{content:"";position:absolute;inset:0 -24px 0 0;background:repeating-linear-gradient(90deg,var(--bc,var(--cyan)) 0 6px,transparent 6px 12px);box-shadow:0 0 4px var(--bc,var(--cyan));animation:bus var(--bus,1s) linear infinite}
.bus.off::before{opacity:.12;animation:none}
.bus.bad{--bc:var(--red)}
@keyframes bus{from{transform:translateX(0)}to{transform:translateX(-12px)}}
.rack.warnS{--bc:var(--amber)}.rack.critS{--bc:var(--red)}
.cpucol{grid-column:3;grid-row:1/-1;display:flex;flex-direction:column;gap:4px;padding:4px;background:linear-gradient(#0c1720,#0a131b);border:1px solid #223848;min-width:0}
.sock{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid #1a2d3a;background:repeating-linear-gradient(0deg,#0b161e 0 3px,#0d1a23 3px 4px);position:relative;min-width:0}
.cpuw{position:relative;width:100%;height:100%}
.cpuw svg{display:block;width:100%;height:100%}
.sock .cpuw{width:auto;height:calc(100% - 12px);aspect-ratio:1;max-width:100%}
.sock > svg{display:block;width:auto;height:calc(100% - 12px);max-width:100%;aspect-ratio:1}
.sock{background:radial-gradient(circle at 50% 45%,rgba(255,106,61,.12),transparent 70%),#070d18}
.sock small{font-family:var(--f-mono);font-size:9px;line-height:11px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sock.e{border-style:dashed;background:repeating-linear-gradient(45deg,#08121a 0 4px,#0b1720 4px 8px)}
.sock.e small{color:var(--ink-faint)}
.rack.idle .bus::before,.rack.down .bus::before{animation:none;opacity:.15}
@media (min-width:600px){ .cab.wide{--rh:22px} }
/* modal: balance + CPU */
.bal{display:flex;flex-direction:column;gap:10px;padding:12px}
.bal .bneck{font-size:13.5px;color:var(--ink);margin:0}
.socks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border:1px solid var(--line);background:#050b10;text-align:center;min-width:0}
.scard > svg,.scard .cpuw{width:64px;height:64px}
.scard b{font-family:var(--f-display);font-size:13px}
.scard small{font-family:var(--f-mono);font-size:11px;color:var(--ink-dim)}
.cputiers .tier{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.cputiers .tier small{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-dim);font-weight:400}
.cputiers .tier.rec{border-color:var(--green)}


/* CPU die animation + PCB traces (reference: glowing orange pin rows, cyan logo, fan-out traces with pads) */
/* CPU core cells light up in two alternating banks; logo glow breathes (overlay layers, opacity only) */
.cm{left:25%;top:25%;width:49.9%;height:47.7%;background-repeat:no-repeat;background-size:100% 9.1%;background-position:0 0,0 100%;animation:cmask 1.8s ease-in-out infinite}
.cm.a{background-image:repeating-linear-gradient(90deg,#0b1633 0 8.7%,transparent 8.7% 26.09%),repeating-linear-gradient(90deg,#0b1633 0 8.7%,transparent 8.7% 26.09%)}
.cm.b{background-image:repeating-linear-gradient(90deg,transparent 0 13.04%,#0b1633 13.04% 21.74%,transparent 21.74% 26.09%),repeating-linear-gradient(90deg,transparent 0 13.04%,#0b1633 13.04% 21.74%,transparent 21.74% 26.09%);animation-delay:-.9s}
@keyframes cmask{0%,100%{opacity:0}50%{opacity:.9}}
.cglow{left:31.5%;top:36.5%;width:37%;height:27%;border-radius:4px;box-shadow:0 0 5px 1.5px var(--c),inset 0 0 4px var(--c);animation:breathe 2.4s ease-in-out infinite}
/* circuit traces: copper base, gold plating, thin highlight; one electron per live trace */
.trc{position:relative;min-width:0}
.tr-row{position:absolute;left:0;right:0;height:14px;container-type:size}
.tr-row::before{content:"";position:absolute;top:2.5px;height:2px;left:0;right:15px;background:linear-gradient(#f6dc8a,#c9a24a);box-shadow:0 0 0 .7px #2a1e08}
.tr-row.r::before{left:15px;right:0}
.tr-k{position:absolute;top:0;right:0;width:16px;height:14px;overflow:visible}
.tr-row.r .tr-k{right:auto;left:0;transform:scaleX(-1)}
.tr-k path{fill:none;stroke-linejoin:miter;stroke-linecap:butt}
.tr-k .u{stroke:#2a1e08;stroke-width:3.4}
.tr-k .g{stroke:#e8c565;stroke-width:2}
.tr-k .pd{fill:#f0cc5c;stroke:#2a1e08;stroke-width:.8}
.tr-k .pc{fill:#fff3c4}
.tr-row.off::before{background:#4a4436;box-shadow:none}
.tr-row.off .g{stroke:#4a4436}.tr-row.off .pd{fill:#3a4658}.tr-row.off .pc{fill:#566377}
.elec{left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle,#fffef5 0 22%,#ffe38a 38%,rgba(255,196,77,.45) 58%,transparent 72%);animation-duration:1.7s,1.7s;animation-timing-function:linear,linear;animation-iteration-count:infinite,infinite}
@keyframes efade{0%{opacity:0}3%{opacity:1}52%{opacity:.9}62%,100%{opacity:0}}
.elec{animation-timing-function:cubic-bezier(.2,.7,.4,1),linear!important;animation-duration:1.6s,1.6s!important}
.elec.t2{width:6px;height:6px;left:-3px;top:-3px;opacity:.8}
.pglow{top:3px;width:15px;height:15px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,200,.95) 0,rgba(255,196,77,.6) 35%,transparent 70%);animation:pflash 1.6s ease-out infinite}
.pglow.l{right:-4px}.pglow.r{left:-4px}
@keyframes pflash{0%{opacity:1;transform:scale(1.35)}22%{opacity:.25;transform:scale(.8)}40%,100%{opacity:0;transform:scale(.6)}}
.cpuw::after{content:"";position:absolute;inset:8%;border-radius:14%;box-shadow:0 0 7px 2px rgba(255,170,70,.75),inset 0 0 5px rgba(255,170,70,.5);opacity:0;pointer-events:none;animation:cpulse 1.6s ease-out infinite}
@keyframes cpulse{0%{opacity:.95;transform:scale(.94)}35%{opacity:0;transform:scale(1.12)}100%{opacity:0;transform:scale(1.12)}}
.scard .cpuw::after,.hwcard .cpuw::after{display:none}
.rack.idle .cpuw::after,.rack.idle .pglow{animation:none;opacity:0}
.rack.critS .elec,.rack.warnS .elec{background:radial-gradient(circle,#fff5f5 0 22%,#ff8a8a 38%,rgba(255,77,99,.45) 58%,transparent 72%)}
.sock .ctemp{position:absolute;right:3px;top:2px;font-family:var(--f-mono);font-size:8.5px;line-height:1}
.cpuoc{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);background:rgba(255,181,71,.04)}


/* NVMe bay between the two CPU sockets: 8 M.2 drives, activity LEDs + read/write sweep */
.cpucol{gap:5px}
.sock{flex:1 1 0}
.ssdbay{flex:.32 1 0;min-height:16px;max-height:34px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;padding:3px;background:#050a12;border:1px solid #1c3044;position:relative}
.ssdbay::before{content:"NVMe";position:absolute;left:3px;top:-1px;transform:translateY(-100%);font:600 7px var(--f-mono);color:var(--ink-faint);letter-spacing:.1em}
.m2{position:relative;border-radius:1px;overflow:hidden;min-width:0;
  background:linear-gradient(to bottom,var(--mc) 0 12%,#0d1a14 12% 16%,transparent 16%),
    repeating-linear-gradient(to bottom,#1b2a36 0 22%,#0f1a22 22% 26%),#0f1a22;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.15)}
.m2::after{content:"";position:absolute;left:20%;right:20%;top:1px;height:2px;border-radius:1px;background:var(--ml);box-shadow:0 0 4px var(--ml);animation:ssdled 1.2s ease-in-out infinite}
.m2:nth-child(2n)::after{animation-delay:-.5s}.m2:nth-child(3n)::after{animation-delay:-.2s}
.m2.e{background:repeating-linear-gradient(to bottom,#0a141c 0 3px,#0c1720 3px 5px);box-shadow:inset 0 0 0 1px #15293a}
.m2.e::after,.m2.e i{display:none}

const maxSock = r => r && (r.master || r.kind==='vault') ? 4 : 2;
const isTrain = r => r && r.kind==='train';
function trainVaultReady(s){ const d=derive(s); return d.racks.some(x=>x.vault && x.V.running && isTrain(x.V.target)); }
function maxedChecks(r){ const g=r.gpus.filter(t=>t===MASTER_T).length, sticks=r.gpus.reduce((a,t,i)=>a+((r.ram[i]||[]).filter(k=>k===RAM_MAX).length),0),

  {gb:8,   w:5,  price:40,    name:'8 GB DDR5'},

  {gb:256, w:20, price:2e8,   name:'256 GB MRDIMM'}
];
const RAM_MAX = RAM.length-1;
// CPUs shuttle data between RAM and GPUs. Each cluster has 2 sockets; their throughput (GB/s) must cover
// GPU feed demand + RAM traffic. Stability = CPU coverage × RAM coverage → revenue ×0.3 (critical) … ×1.25 (stable).
const CPU = [
  {name:'Core i3',          model:'14100',   brand:'core', cores:4,   bw:60,   w:60,  price:100},
  {name:'Core i5',          model:'14600K',  brand:'core', cores:14,  bw:115,   w:125, price:400},
  {name:'Core i7',          model:'14700K',  brand:'core', cores:20,  bw:230,  w:150, price:2500},
  {name:'Core i9',          model:'14900K',  brand:'i9',   cores:24,  bw:420,  w:250, price:15000},
  {name:'Xeon W',           model:'3495X',   brand:'xeonw',cores:56,  bw:650,  w:350, price:2e5},
  {name:'Threadripper PRO', model:'7995WX',  brand:'tr',   cores:96,  bw:1200,  w:350, price:2e6},
  {name:'Xeon Platinum',    model:'8592+',   brand:'xeonp',cores:64,  bw:1700, w:350, price:2.5e7},
  {name:'EPYC Genoa',       model:'9654',    brand:'epyc', cores:96,  bw:2600, w:360, price:4e8},
  {name:'EPYC Turin',       model:'9965',    brand:'turin',cores:192, bw:4200, w:500, price:5e9}
];
const CPU_MAX = CPU.length-1;
// NVMe SSDs: 8 M.2 slots per cluster. Storage boost (up to +50% compute) scales with SSD capacity vs 16× cluster VRAM,
// counting only storage the RAM can cache (≤ 4× RAM). Adding SSD or RAM never lowers output.
const SSD = [
  {gb:64,   w:3, price:60,    name:'64 GB NVMe'},
  {gb:128,  w:4, price:300,   name:'128 GB NVMe'},
  {gb:256,  w:5, price:2500,  name:'256 GB NVMe'},
  {gb:512,  w:6, price:3e4,   name:'512 GB NVMe'},
  {gb:1024, w:7, price:6e5,   name:'1 TB NVMe'},
  {gb:2048, w:8, price:2e7,   name:'2 TB NVMe Gen5'},
  {gb:4096, w:9, price:8e8,   name:'4 TB NVMe Gen5'}
];
const SSD_MAX = SSD.length-1;
const ssdUpCost = k => SSD[k+1].price - .25*SSD[k].price;
const ssdAllToCost = (r,k) => { let c=0; const d=r.ssd||[]; for(let j=0;j<8;j++){ const q=d[j]; if(q===undefined) c+=SSD[k].price; else if(q<k) c+=SSD[k].price-.25*SSD[q].price; } return c; };
const storageBoost = (ssdGB, ramGBt, vramT) => { if(!ssdGB || !vramT) return 0; const eff = Math.min(ssdGB, 4*ramGBt); return .5*Math.pow(Math.min(1, eff/(16*vramT)), .7); };

const stabLabel = st => st>=.95 ? ['STABLE','ok'] : st>=.8 ? ['BALANCED','info'] : st>=.5 ? ['UNSTABLE','warn'] : ['CRITICAL','crit'];
const cpuUpCost = (from,to) => CPU[to].price - (from==null ? 0 : .25*CPU[from].price);
const ramFactor = x => x<=0 ? 0 : .35 + .65*Math.min(1,x) + .35*Math.log2(Math.min(8, Math.max(1,x)));
const ramGB = sticks => (sticks||[]).reduce((a,k)=>a+RAM[k].gb,0);

  cancelContract(s,cid){ const C=s.contracts, c=C.active.find(q=>q.id===cid); if(!c) return false; C.active.splice(C.active.indexOf(c),1); C.stats.failed++; return true; },
  buildMaster(s){ if(!s.research.t5 || s.racks.some(r=>r.master)) return false; if(!spend(s,MASTER_COST)) return false;

  ramOc(s,rid,v){ const r=s.racks.find(x=>x.id===rid); if(r) r.ramOc=Math.max(0,Math.min(1,v)); return !!r; },
  ramAllTo(s,rid,k){ const r=s.racks.find(x=>x.id===rid); if(!r) return 0; let n=0;

  grid(s){ const n=GRID[s.power.grid+1]; if(!n) return false; if(!spend(s,n.cost)) return false; s.power.grid++; return true; },
  gen(s,k){ const G=GEN[k]; if(G.req && !s.research[G.req]) return false; if(s.power[k]>=G.max) return false; if(!spend(s,genCost(s,k))) return false; s.power[k]++; return true; },

  unlock(s,mid){ const m=MB[mid]; if(!m||s.unlocked[mid]) return false; if(!spend(s,m.unlock)) return false; s.unlocked[mid]=true; return true; },
  research(s,id){

      s.rp -= n.cost; s.research[id]=true; return true; }
    return false;
  },
  boost(s,k,d){ const b=s.boosters[k]; if(b && b.ready > s.time) return false; const c=boostCost(s,d); if(s.rp<c) return false; s.rp-=c; s.boosters[k]={until:s.time+BOOSTERS[k].dur, ready:s.time+BOOSTERS[k].cd}; return true; }
};
function repGain(s){ return Math.floor(8*Math.pow(s.runEarned/1e7, .35)); }
function relocate(s, i){ const D=DISTRICTS[i]; if(!D) return false; if(!(s.visited.includes(i) || s.runEarned>=D.req)) return false;
  s.rep += repGain(s); s.district=i; if(!s.visited.includes(i)) s.visited.push(i); s.rp=0; freshRun(s); return true; }
function bestModel(s, x, e){
  let best=null, bv=-1;
  for(const m of MODELS){ if(!s.unlocked[m.id]) continue; const y=rackStats(s,{...x.r, model:m.id},e); if(!y.host) continue;
    const v = y.qps*m.rate; if(v>bv){bv=v; best=m.id;} }
  return best;
}
function automate(s){
  const e = fx(s), off = s.autoOff||{}; let changed=false;

  return changed;
}
/*ENGINE-END*/

<script>

      const z0=slots[i], z1=z0+RW, x=sd*1.9;
      const a=P(x,FLOOR,z0), b=P(x,.75,z0), c2=P(x,.75,z1), d=P(x,FLOOR,z1);
      const shade=Math.min(1, 6/z0);
      gr=g.createLinearGradient(a[0],0,d[0],0); gr.addColorStop(0,`rgba(38,52,64,${.95})`); gr.addColorStop(1,`rgba(22,32,41,${.95})`);
      g.fillStyle=gr; poly([a,b,c2,d]); g.fill();
      g.strokeStyle=`rgba(90,130,160,${.35*shade+.1})`; g.lineWidth=1; g.stroke();
      // server unit lines + LEDs
      const rows=14;
      for(let k=1;k<rows;k++){
        const y=FLOOR+k*(RH/rows);
        const p1=P(x,y,z0+.05), p2=P(x,y,z1-.05);
        g.strokeStyle=`rgba(0,0,0,${.35})`; g.beginPath(); g.moveTo(...p1); g.lineTo(...p2); g.stroke();
        if(rnd()<.75){
          const n=1+Math.floor(rnd()*3);
          for(let j=0;j<n;j++){
            const zz=z0+.08+rnd()*(RW-.16), p=P(x,y+RH/rows*.45,zz);
            const r=Math.max(.6, f/zz*.012);
            const col = rnd()<.12 ? '61,255,162' : rnd()<.5 ? '67,227,255' : '80,130,255';
            g.fillStyle=`rgba(${col},${.9})`; g.shadowColor=`rgba(${col},1)`; g.shadowBlur=r*5;
            g.beginPath(); g.arc(p[0],p[1],r,0,Math.PI*2); g.fill();
          }
        }
      }
      g.shadowBlur=0;
      // top header strip with blue glow like the reference
      const h1=P(x,.62,z0+.04), h2=P(x,.62,z1-.04);
      g.strokeStyle='rgba(67,160,255,.55)'; g.lineWidth=Math.max(1,f/z0*.018); g.beginPath(); g.moveTo(...h1); g.lineTo(...h2); g.stroke();
    }
  }
  // near fog
  gr=g.createLinearGradient(0,H*.75,0,H); gr.addColorStop(0,'rgba(6,10,15,0)'); gr.addColorStop(1,'rgba(6,10,15,.8)');
  g.fillStyle=gr; g.fillRect(0,H*.75,W,H*.25);
}

function flowBar(){
  const tot=Math.max(D.demand, D.supply, .001);
  const segs=[['solar','src-solar'],['smr','src-smr'],['grid','src-grid'],['batt','src-batt'],['diesel','src-diesel']]
   .map(([k,c])=>`<i class="${c}" data-flow="${k}" style="width:${(D.use[k]/tot*100).toFixed(2)}%"></i>`).join('');
  return `<div class="flow" id="flow">${segs}<i class="deficit" data-flow="deficit" style="width:${(D.unserved/tot*100).toFixed(2)}%"></i></div>`;
}
function sunPos(){ const ph=(S.time%DAY)/DAY; const day=ph<.5; const t=day?ph*2:(ph-.5)*2; const x=6+t*98; const y=34-Math.sin(t*Math.PI)*28; return {x,y,day}; }

function drawMap(){
  const c=$('#map'); if(!c) return;
  const W=c.clientWidth||600, H=W/2, dpr=Math.min(2,window.devicePixelRatio||1);
  c.width=W*dpr; c.height=H*dpr; const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const LAND=[
    [[-168,65],[-140,70],[-95,72],[-75,62],[-60,48],[-80,31],[-81,25],[-97,20],[-87,12],[-80,8],[-105,20],[-117,32],[-124,42],[-125,49],[-150,59]],
    [[-50,60],[-20,70],[-25,82],[-60,81],[-70,76]],
    [[-80,10],[-60,9],[-35,-6],[-40,-22],[-58,-38],[-68,-55],[-75,-45],[-70,-18],[-81,-5]],
    [[-10,36],[-9,43],[-2,44],[-5,48],[5,51],[9,57],[5,62],[15,69],[28,71],[40,66],[42,46],[28,41],[18,40],[12,44],[3,42]],
    [[-6,50],[2,51],[-2,58],[-6,57]],
    [[-24,64],[-13,64],[-15,66],[-22,66.5]],
    [[-17,15],[-12,5],[8,4],[10,-4],[13,-20],[18,-34],[28,-33],[35,-24],[40,-12],[51,11],[43,12],[33,30],[10,37],[-6,36]],
    [[35,36],[42,46],[40,66],[60,70],[100,77],[140,72],[178,68],[160,58],[135,46],[122,31],[108,20],[104,10],[98,16],[92,22],[88,21],[80,9],[73,20],[66,25],[57,25],[52,17],[44,13],[35,28]],
    [[96,5],[118,5],[140,-2],[140,-8],[114,-8],[105,-6]],
    [[114,-22],[130,-12],[142,-11],[153,-26],[147,-38],[134,-32],[115,-34]],
    [[130,31],[137,35],[142,39],[145,44],[140,42],[134,34]]
  ];
  const inPoly=(x,y,p)=>{ let o=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const [xi,yi]=p[i],[xj,yj]=p[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) o=!o; } return o; };
  const X=lon=>(lon+180)/360*W, Y=lat=>(90-lat)/180*H*1.0 - H*.02;
  const step=W>500?3:4;
  g.fillStyle='rgba(67,227,255,.05)'; g.fillRect(0,0,W,H);
  for(let lat=84; lat>-60; lat-=step){ for(let lon=-180; lon<180; lon+=step){
    if(LAND.some(p=>inPoly(lon,lat,p))){ g.fillStyle='rgba(67,227,255,.42)'; g.beginPath(); g.arc(X(lon),Y(lat),Math.max(1,W/420),0,Math.PI*2); g.fill(); }
  }}
  DISTRICTS.forEach((d,i)=>{
    const x=X(d.lon), y=Y(d.lat), cur=i===S.district, vis=S.visited.includes(i);
    const col = cur?'#3dffa2':vis?'#43e3ff':'#ffb547';
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=1.5;
    g.beginPath(); g.arc(x,y,cur?7:5,0,Math.PI*2); g.stroke();
    g.beginPath(); g.arc(x,y,2.2,0,Math.PI*2); g.fill();
    g.font='600 11px "Chakra Petch", sans-serif'; g.textAlign = x>W*.8?'right':'left';
    g.fillText(d.name.toUpperCase(), x+(x>W*.8?-10:10), y+ (i===4? -8 : 4));
  });
}

// Hub rendering is keyed: a cluster's DOM is only rebuilt when its hardware changes,
// so animations keep running and purchases don't redraw every cabinet.
const cardCache = new Map(); let rackRefs = new Map(); let io=null;
function syncAnims(root){ return; try{ const list = root && root.getAnimations ? root.getAnimations({subtree:true}) : (document.getAnimations ? document.getAnimations() : []); for(const a of list){ if(a.playState!=='paused') a.startTime = 0; } }catch(e){} }
function observeRack(el){
  if(!('IntersectionObserver' in window)) return;
  if(!io) io = new IntersectionObserver(ents=>{ for(const en of ents){ const on=en.isIntersecting; en.target.classList.toggle('offv', !on); if(on) syncAnims(en.target); } }, {rootMargin:'120px 0px'});
  io.observe(el);
}
function renderHub(v){
  const h = viewHub();
  if(!$('#racks')){ cardCache.clear(); v.innerHTML = `<div id="hubtop"></div><div class="section-head" id="hubhead"></div><div class="racks" id="racks"></div>`; }
  $('#hubtop').innerHTML = h.top; $('#hubhead').innerHTML = h.head;
  const box = $('#racks'), keep = new Set(), made=[];
  let prev = null;
  for(const [key, html] of h.racksHTML){
    keep.add(key);
    let el = box.querySelector(`:scope > [data-key="${key}"]`);
    if(!el || cardCache.get(key)!==html){
      const t=document.createElement('template'); t.innerHTML=html.trim(); const nel=t.content.firstElementChild; nel.dataset.key=key;
      if(el) el.replaceWith(nel); else box.appendChild(nel);
      el = nel; cardCache.set(key, html); if(nel.classList.contains('rack') && 'IntersectionObserver' in window){ nel.classList.add('offv'); observeRack(nel); made.push(nel); }
    }
    const want = prev ? prev.nextElementSibling : box.firstElementChild;
    if(want!==el) box.insertBefore(el, want);
    prev = el;
  }
  [...box.children].forEach(c=>{ if(!keep.has(c.dataset.key)){ cardCache.delete(c.dataset.key); if(io) io.unobserve(c); c.remove(); } });
  rackRefs = new Map();
  box.querySelectorAll(':scope > .rack').forEach(el=>rackRefs.set(el.dataset.id, {el, temp:el.querySelector('[data-temp]'), rev:el.querySelector('[data-rev]'), stab:el.querySelector('[data-stab]'), load:el.querySelector('[data-load]'), dot:el.querySelector('[data-dot]'), net:el.querySelector('[data-net]'), ct:[...el.querySelectorAll('[data-ctemp]')], pbar:el.querySelector('[data-pbar]'), plabel:el.querySelector('[data-plabel]'), pright:el.querySelector('[data-pright]'), k:''}));
}
function render(){
  D = derive(S);
  const v=$('#view');
  if(view==='hub') renderHub(v);
  else if(view==='models'){ cardCache.clear(); v.innerHTML=viewModels(); }
  else if(view==='power'){ cardCache.clear(); v.innerHTML=viewPower(); }
  else if(view==='districts'){ cardCache.clear(); v.innerHTML=viewDistricts(); requestAnimationFrame(drawMap); }
  else if(view==='ent'){ cardCache.clear(); v.innerHTML=viewEnterprise(); }
  const eb=$('nav.dock [data-nav="ent"]'); if(eb) eb.hidden = !S.orgUnlocked;
  $$('nav.dock button').forEach(b=>b.setAttribute('aria-current', b.dataset.nav===view || (view==='research'&&b.dataset.nav==='research') ? 'page':'false'));
  renderModal();
  live(true);
}

function openModal(m){ modal=m; renderModal(); live(); }

function renderModal(){
  const root=$('#modal-root');
  document.body.classList.toggle('mopen', !!modal);
  if(!modal){ root.innerHTML=''; syncAnims($('#racks')); return; }
  let inner='', narrow=false;
  if(modal.type==='rack') inner = rackModal();
  else if(modal.type==='research') inner = researchHTML();
  else if(modal.type==='settings'){ narrow=true; inner = `<div class="modal-head"><h2>Game menu<small>Level ${Math.max(1,Math.floor(Math.log10(S.lifetime+10)*4)-3)} · ${$f(S.lifetime)} earned all-time</small></h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <p style="margin:0;color:var(--ink-dim)">Progress autosaves every 5 seconds in this browser.</p>
    <button class="btn amber block" data-act="restart">Restart game</button>
    <button class="btn ghost block" data-act="close">Back to facility</button>`; }
  else if(modal.type==='confirm'){ narrow=true; inner = `<div class="modal-head"><h2>${modal.title}</h2><button class="x" data-act="close" aria-label="Close">×</button></div><p style="margin:0;color:var(--ink-dim)">${modal.body}</p><div class="split"><button class="btn amber" data-act="confirm-yes">${modal.yes}</button><button class="btn ghost" data-act="close">Cancel</button></div>`; }
  else if(modal.type==='offline'){ narrow=true; inner = `<div class="modal-head"><h2>Welcome back<small>Facility ran unattended for ${modal.time}</small></h2><button class="x" data-act="close" aria-label="Close">×</button></div>
    <dl class="kv"><dt>Credits earned</dt><dd class="big" style="color:var(--green)">${$f(modal.cc)}</dd><dt>Research</dt><dd style="color:var(--violet)">+${fmt(modal.rp)} RP</dd><dt>Efficiency</dt><dd>${pct(modal.eff)} of live rate${modal.capped?' · capped':''}</dd></dl>
    <p style="margin:0;color:var(--ink-dim);font-size:14px">${modal.capped?`Offline progress stops after ${modal.hours}h. SysAdmin research extends it.`:'Idle earnings are paid at a reduced rate until you research Follow-the-Sun Ops.'}</p>
    <button class="btn primary block" data-act="close">Resume operations</button>`; }
  const sc = root.querySelector('.modal')?.scrollTop||0;
  root.innerHTML = `<div class="modal-back" data-act="backdrop"><div class="hud modal ${narrow?'narrow':''}" role="dialog" aria-modal="true">${inner}</div></div>`;
  const md=root.querySelector('.modal'); if(md){ md.scrollTop=sc; syncAnims(md); }
}

function forecast(mut){
  const c = JSON.parse(JSON.stringify(S)); c.credits=1e300; mut(c); const d=derive(c);
  return {demand:d.demand, load:d.load, supply:d.supply};
}
function impactLine(f){
  const delta=f.demand-D.demand;

}

// ---------- actions ----------
function act(fn, okMsg){ const ok=fn(); if(ok){ if(okMsg) toast(okMsg,'ok'); render(); save(); } return ok; }
document.addEventListener('click', ev=>{
  const nav=ev.target.closest('[data-nav]');
  if(nav){ const v=nav.dataset.nav; if(v==='research'){ if(view!=='research') prevView=view; view='research'; openModal({type:'research'}); $$('nav.dock button').forEach(b=>b.setAttribute('aria-current', b.dataset.nav==='research'?'page':'false')); return; }
    view=v; modal=null; render(); $('#main').scrollTop=0; return; }

    case 'open-rack': openModal({type:'rack',id}); break;
    case 'open-research': if(view!=='research') prevView=view; view='research'; openModal({type:'research'}); render(); break;
    case 'go': { const g=el.dataset.go; if(g.startsWith('rack:')){ const rr=S.racks.find(q=>q.id===g.slice(5)); if(rr){ hubBay = isNet(rr)?'net':bayOf(rr); if(view==='hub') render(); } openModal({type:'rack',id:g.slice(5)}); } else if(g!=='hub'){ view=g; render(); } break; }

    case 'bay': hubBay=el.dataset.b; try{ localStorage.setItem('aiTycoon.bay',hubBay); }catch(e){} render(); $('#main').scrollTop=0; break;

    case 'nup': act(()=>A.netUp(S,el.dataset.key)); break;
    case 'xcvrup': act(()=>A.xcvrUp(S),'Transceiver upgraded'); break;
    case 'ibset': act(()=>A.ibSet(S,el.dataset.b,+el.dataset.k),'InfiniBand switch installed'); break;
    case 'vtier': vTier[id+el.dataset.key]=+el.dataset.k; renderModal(); live(true); break;
    case 'vfill': act(()=>{ const n=A.bankFill(S,id,el.dataset.key,vTier[id+el.dataset.key]); if(n) toast(`${n} ${el.dataset.key==='bank'?'RAM stick':'drive'}${n>1?'s':''} installed`,'ok'); return n>0; }); break;

    case 'fillssd': act(()=>{ const n=A.fillSsd(S,id,ssdTier[id]); if(n) toast(`${n} × ${SSD[ssdTier[id]].name} installed`,'ok'); return n>0; }); break;
    case 'upssd': act(()=>A.upSsd(S,id)); break;
    case 'upallssd': act(()=>{ let n=0; while(n<64 && A.upSsd(S,id)) n++; if(n) toast(`${n} drive upgrade${n>1?'s':''}`,'ok'); else toast('Not enough credits for the next drive upgrade','warn'); return n>0; }); break;
    case 'tab': modal.tab=el.dataset.t; lastTab=modal.tab; renderModal(); live(true); break;
    case 'ramallto': act(()=>{ const k=ramTier[id]; const n=A.ramAllTo(S,id,k); if(n) toast(`${n} RAM slot${n>1?'s':''} set to ${RAM[k].gb} GB`,'ok'); return n>0; }); break;
    case 'ssdallto': act(()=>{ const k=ssdTier[id]; const n=A.ssdAllTo(S,id,k); if(n) toast(`${n} drive${n>1?'s':''} set to ${SSD[k].name}`,'ok'); return n>0; }); break;
    case 'autotoggle': act(()=>{ S.autoOff=S.autoOff||{}; S.autoOff[el.dataset.k]=!S.autoOff[el.dataset.k]; return true; }); break;
    case 'cputier': cpuTier[id]=+el.dataset.k; renderModal(); live(true); break;
    case 'cpu': act(()=>A.cpu(S,id,+el.dataset.s,cpuTier[id]), CPU[cpuTier[id]].name+' installed'); break;
    case 'ramtier': ramTier[id]=+el.dataset.k; renderModal(); live(true); break;
    case 'addstick': act(()=>A.addStick(S,id,modal.gi,ramTier[id])); break;
    case 'fillgpu': act(()=>{ const n=A.fillRam(S,id,modal.gi,ramTier[id]); if(n) toast(`${n} × ${RAM[ramTier[id]].gb} GB installed`,'ok'); return n>0; }); break;
    case 'fillallram': act(()=>{ const n=A.fillRam(S,id,null,ramTier[id]); if(n) toast(`${n} RAM sticks installed across the cluster`,'ok'); return n>0; }); break;
    case 'upstick': act(()=>A.upStick(S,id,modal.gi)); break;
    case 'upallram': act(()=>{ let n=0; while(n<512 && A.upStick(S,id,null)) n++; if(n) toast(`${n} RAM stick upgrade${n>1?'s':''}`,'ok'); else toast('Not enough credits for the next RAM upgrade','warn'); return n>0; }); break;
    case 'add': act(()=>A.addGpu(S,id,addTier[id])); break;
    case 'up': act(()=>A.upGpu(S,id)); break;
    case 'fill': act(()=>{ const n=A.fill(S,id,addTier[id]); if(n) toast(`${n} × ${GPU[addTier[id]].name} installed`,'ok'); return n>0; }); break;
    case 'hire': act(()=>A.hire(S,id,+el.dataset.k), MANAGERS[+el.dataset.k].title+' assigned'); break;
    case 'settings': openModal({type:'settings'}); break;
    case 'restart': openModal({type:'confirm', title:'Restart game', body:'This wipes all progress in this browser: credits, clusters, research, reputation and districts. You start again with one RTX 3090.', yes:'Restart from zero', run:()=>{ S=freshState(); addTier={}; ramTier={}; cpuTier={}; ssdTier={}; try{localStorage.removeItem(SAVE_KEY);}catch(e){} toast('New game started','ok'); }}); break;
    case 'upall': act(()=>{ let n=0; while(A.upGpu(S,id)) n++; if(n) toast(`${n} GPU${n>1?'s':''} upgraded`,'ok'); return n>0; }); break;
    case 'liquid': act(()=>A.liquid(S,id),'Liquid cold plate installed'); break;
    case 'model': act(()=>A.model(S,id,el.dataset.m)); break;
    case 'unlock': act(()=>A.unlock(S,el.dataset.m), MB[el.dataset.m].name+' licensed'); break;
    case 'grid': act(()=>A.grid(S),'Grid service upgraded'); break;
    case 'crac': act(()=>A.crac(S),'CRAC capacity added'); break;
    case 'gen': act(()=>A.gen(S,el.dataset.k), GEN[el.dataset.k].name+' online'); break;
    case 'sellgen': act(()=>A.sellGen(S,el.dataset.k)); break;
    case 'research': { const nid=el.dataset.id; const node=Object.values(RESEARCH).flatMap(b=>b.nodes).find(n=>n.id===nid); act(()=>A.research(S,nid), node.name+' complete'); break; }
    case 'boost': act(()=>A.boost(S,el.dataset.k,D), BOOSTERS[el.dataset.k].name+' engaged'); break;
    case 'relocate': { const i=+el.dataset.i, d=DISTRICTS[i];
      openModal({type:'confirm', title:'Relocate to '+d.name, body:`You gain <b style="color:var(--gold)">+${repGain(S)} ★</b> reputation (+${repGain(S)*3}% revenue). Credits, clusters, power and cooling reset; research stays.`, yes:'Relocate', run:()=>{ if(relocate(S,i)){ toast('Welcome to '+d.name,'ok'); } }}); break; }
    case 'reset': openModal({type:'confirm', title:'Wipe save', body:'This deletes all progress in this browser, including research and reputation.', yes:'Wipe and restart', run:()=>{ S=freshState(); try{localStorage.removeItem(SAVE_KEY);}catch(e){} }}); break;
    case 'confirm-yes': { const run=modal.run; modal=null; run(); view='hub'; prevView='hub'; render(); save(); break; }
  }
});
document.addEventListener('input', ev=>{
  const c=ev.target.closest('[data-cpuoc]'); if(c){ const v=+c.value/100; A.cpuOc(S,c.dataset.cpuoc,v); D=derive(S);
    set('coc-val','+'+Math.round(v*40)+'% throughput'); set('coc-note',`CPU heat +${Math.round(v*150)}% · power +${Math.round(v*80+v*10)}%`); live(); return; }
  const ro=ev.target.closest('[data-ramoc]'); if(ro){ const v=+ro.value/100; A.ramOc(S,ro.dataset.ramoc,v); D=derive(S);
    set('roc-val','+'+Math.round(v*20)+'% compute'); set('roc-note',`RAM power +${Math.round(v*60)}% · RAM heat +${Math.round(v*100)}% · more data for the CPU to move`); live(); return; }
  const r=ev.target.closest('[data-oc]'); if(!r) return;
  const v=+r.value/100; A.oc(S,r.dataset.oc,v); D=derive(S); const rk=S.racks.find(q=>q.id===r.dataset.oc);
  set('oc-val','+'+Math.round(v*50)+'% TFLOPS'); set('oc-note', ocNote(rk, v)); live();
});
document.addEventListener('change', ev=>{ if(ev.target.closest('[data-oc],[data-cpuoc],[data-ramoc]')){ save(); render(); } });
document.addEventListener('keydown', ev=>{ if(ev.key==='Escape' && modal) closeModal(); });

// ---------- loop ----------
let lastT=performance.now(), acc=0, autoAcc=0, liveAcc=0, saveAcc=0, prevState={};
function watchEvents(){
  if(S._ev && S._ev.length){ const evs=S._ev; S._ev=[]; let re=false; for(const [t,m] of evs){ if(m) toast(m, t==='cfail'?'warn':'ok'); if(t!=='offer' || view==='ent') re=true; } if(re) render(); }
  if(S._event==='trip'){ toast('Breaker tripped: facility overloaded. Racks offline for 8s.','crit'); S._event=null; render(); }
  const st = D.tripped?'trip':D.pf<.995?'brown':'ok';
  if(st!==prevState.power){ if(st==='brown') toast('Brownout: power supply is short of demand.','warn'); prevState.power=st; if(view==='hub'||view==='power') render(); }
}
const TICK = .25;
function loop(){
  const now=performance.now(); let dt=(now-lastT)/1000; lastT=now;
  if(document.hidden) return;                     // offline() credits hidden time on return
  if(dt>5) dt=5; if(dt<0) dt=0;
  acc+=dt; let stepped=false;
  while(acc>=TICK){ D=step(S,TICK); acc-=TICK; autoAcc+=TICK; stepped=true; }
  if(!stepped) return;
  if(autoAcc>=2){ autoAcc=0; if(automate(S)) render(); }
  watchEvents(); live();
  saveAcc+=dt; if(saveAcc>=5){ saveAcc=0; save(); }
}
function offline(){
  const el=(Date.now()-(S.last||Date.now()))/1000; if(el<30) return;
  const e=fx(S); const cap=e.offlineH*3600; const t=Math.min(el,cap);
  const d=derive(S); const cc=Math.max(0,d.net)*t*e.offlineEff, rp=d.rpRate*t*e.offlineEff;
  S.credits+=cc; S.rp+=rp; S.runEarned+=Math.max(0,d.gross)*t*e.offlineEff; S.lifetime+=Math.max(0,d.gross)*t*e.offlineEff;
  { const dd=derive(S); const chunk=Math.min(t*e.offlineEff, 3600*6), n=Math.max(1,Math.ceil(chunk/60)); for(let k=0;k<n;k++){ progress(S, dd, chunk/n); S.time += chunk/n; } }
  S.time += Math.max(0, Math.min(t, DAY*3) - Math.min(t*e.offlineEff, 3600*6));
  if(cc>0 || rp>0){ const h=Math.floor(t/3600), m=Math.floor(t%3600/60);
    modal={type:'offline', cc, rp, eff:e.offlineEff, capped:el>cap, hours:e.offlineH, time:(h?h+'h ':'')+m+'m'}; }
}
function start(data){
  S = (data && data.state) ? data.state : (load() || freshState());
  D = derive(S);
  if(!(data && data.state)) offline();
  drawScene(); render(); save();
  if(S._netGift){ delete S._netGift; setTimeout(()=>toast('Your facility now has a Network Core in Bay 1, sized to keep every cluster online. Upgrade it as you grow.','ok'),1500); }
  if(S._refund){ const b=S._refund; delete S._refund; setTimeout(()=>toast(`Automation bots were retired from research. ${fmt(b)} RP refunded.`,'ok'),1200); }
  if(S._cpuGift){ delete S._cpuGift; setTimeout(()=>toast('CPUs are here: each cluster got free CPUs sized to its load. Keep CPU, RAM and GPUs balanced for ×1.25.','ok'),900); }
  if(S._ramGift){ delete S._ramGift; setTimeout(()=>toast('RAM is here: your existing GPUs were fitted with free starter sticks. Upgrade them for more compute.','ok'),600); }
  lastT=performance.now(); setInterval(loop, TICK*1000);
  setTimeout(()=>syncAnims(document), 300);
}
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ drawScene(); if(view==='districts') drawMap(); },150); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); else { const was=S.last; offline(); if(modal&&modal.type==='offline') renderModal(); lastT=performance.now(); } });
window.addEventListener('pagehide', save);
const hot = window.claude && window.claude.hot;
if(hot && hot.snapshot) hot.snapshot(()=>({state:S}));
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

<script>
  // Offline support: register the service worker (ignored where unsupported)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
